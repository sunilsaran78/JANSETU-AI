<style>
:root{--bg:#F5F6FA;--card:#fff;--ink:#16213A;--mute:#5B647A;--line:#DDE1EC;--navy:#1B2A4A;--saf:#E8891C;--grn:#1E7A4F;--amb:#A86A00;--on:#fff;

:root[data-theme="dark"]{--bg:#0F1524;--card:#18203A;--ink:#EEF1F8;--mute:#A0A9C0;--line:#2B3556;--navy:#2A3B66;--grn:#4CC38A;--amb:#F0B04A}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 "Mukta","Noto Sans Kannada",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:800;font-size:22px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.logo svg{width:34px;height:22px}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
#lang{width:auto;padding:6px 10px}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
h1{font-size:clamp(32px,8vw,50px);line-height:1.1;margin:18px 0 12px;font-weight:800}
h2{font-size:24px;margin:8px 0 4px}
.hero{padding:10px 0 6px}.hero p{color:var(--mute);max-width:52ch;margin:0 0 20px}
.btn{background:var(--saf);color:#1a1100;border:0;border-radius:10px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.bridge{margin:24px 0 8px;width:100%;height:auto}
.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--mute);margin-top:18px}
.stats b{color:var(--ink)}
label{display:block;font-weight:600;margin:16px 0 6px}
.chk{display:flex;gap:10px;align-items:center;font-weight:400}.chk input{width:20px;height:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--saf)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{font-weight:800;font-size:15px;white-space:nowrap}
.g{color:var(--grn)}.y{color:var(--amb)}
.bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.bar.y i{background:var(--amb)}
.mute{color:var(--mute);font-size:15px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
.ok{list-style:none;padding:0}.ok li:before{content:"✓ ";color:var(--grn);font-weight:800}.ok li.no:before{content:"✗ ";color:var(--amb)}
.note{border-left:4px solid var(--saf);padding:8px 12px;font-size:14px;color:var(--mute);margin-top:22px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}.sec h3{margin:4px 0;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:14px}
</style>
</head>

const V="Oct 2026 (sample data)";
let L="en",P={age:"",state:"",occ:"",inc:"",gen:"",cat:"",dis:false},ERR=false,$=s=>document.querySelector(s);
const t=k=>T[L][k];
function match(s,p){const r=[],R=T[L].r;
if(s.s&&!s.s.includes(p.state))return null;
if(s.g&&s.g!==p.gen)return null;
if(s.d&&!p.dis)return null;
if(s.gc&&!(p.gen==="F"||p.cat==="sc"||p.cat==="st"))return null;
if(s.c&&!s.c.includes(p.cat))return null;
if(s.o&&!s.o.includes(p.occ))return null;
if(p.age<s.a[0]||p.age>s.a[1])return null;
const lo={1:0,2.5:1,5:2.5,8:5,99:8}[p.inc];
if(lo>=s.i)return null;
let w=0,m=0;const add=(wt,k,y,n)=>{w+=wt;m+=wt*k;r.push([k===1,k===1?y:n])};
add(30,1,R.age,R.nage);
add(40,p.inc<=s.i?1:.5,R.inc,R.ninc);
if(s.o)add(30,1,R.occ,R.nocc);
if(s.s)r.push([true,R.state]);if(s.g)r.push([true,R.gen]);if(s.c||s.gc)r.push([true,R.cat]);if(s.d)r.push([true,R.dis]);
return{s,sc:Math.round(m/w*100),r}}
function lbl(sc){return sc>=90?t("excellent"):sc>=70?t("likely"):t("possible")}
function opts(o,sel){return `<option value="" disabled${sel===""?" selected":""}>${t("sel")}</option>`+Object.entries(o).map(([k,v])=>`<option value="${k}"${String(sel)===k?" selected":""}>${v}</option>`).join("")}
function home(){$("#app").innerHTML=`<section class="hero"><svg class="bridge" viewBox="0 0 700 90" fill="none" stroke="var(--saf)" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M0 80h700"/><path d="M30 80C30 20 130 12 175 12s145 8 145 68M320 80c0-60 100-68 145-68s145 8 145 68M175 12v68M465 12v68"/><path d="M60 80V60M100 80V30M250 80V30M290 80V60M350 80V60M390 80V30M540 80V30M580 80V60" stroke-width="2" stroke="var(--navy)"/></svg>
<h1>${t("h")}</h1><p>${t("p")}</p><button class="btn" id="go">${t("cta")}</button><div class="stats"><span>${t("tag")}</span><span><b>${t("stats")}</b></span></div></section><div class="note">${t("disc")}</div>`;
$("#go").onclick=form}
function form(){const s=t("st"),p=P;
$("#app").innerHTML=`<h2>${t("cta")}</h2>
<label for="age">${t("age")}</label><input id="age" type="number" inputmode="numeric" min="0" max="110" placeholder="${t("age")}" value="${p.age}">
<label for="state">${t("state")}</label><select id="state">${opts(s,p.state)}</select>
<label for="occ">${t("occ")}</label><select id="occ">${opts(t("o"),p.occ)}</select>
<label for="inc">${t("inc")}</label><select id="inc">${opts(t("i"),p.inc)}</select>
<label for="gen">${t("gen")}</label><select id="gen">${opts(t("g"),p.gen)}</select>
<label for="cat">${t("cat")}</label><select id="cat">${opts(t("c"),p.cat)}</select>
<label class="chk"><input id="dis" type="checkbox"${p.dis?" checked":""}>${t("dis")}</label>
${ERR?`<p class="y" role="alert"><b>${t("err")}</b></p>`:""}<p><button class="btn" id="go">${t("find")}</button></p>`;ERR=false;
$("#go").onclick=()=>{P={age:+$("#age").value||0,state:$("#state").value,occ:$("#occ").value,inc:$("#inc").value?+$("#inc").value:"",gen:$("#gen").value,cat:$("#cat").value,dis:$("#dis").checked};if(!P.age||!P.state||!P.occ||!P.inc||!P.gen||!P.cat){ERR=true;form();return}results()}}
function results(){const res=S.map(s=>match(s,P)).filter(x=>x&&x.sc>=50).sort((a,b)=>b.sc-a.sc);
$("#app").innerHTML=`<h2>🎯 ${res.length} ${res.length===1?t("m1"):t("mN")}</h2><p><button class="btn alt" id="ed">${t("edit")}</button></p>`+(res.length?res.map((x,i)=>`<div class="card click" tabindex="0" role="button" data-i="${i}"><div class="row"><b>${x.s.n[["en","kn","hi"].indexOf(L)]}</b><span class="pill ${x.sc>=70?"g":"y"}">${x.sc}%</span></div><div class="bar ${x.sc>=70?"":"y"}"><i style="width:${x.sc}%"></i></div><div class="mute">${lbl(x.sc)} · ${x.s.b}</div></div>`).join(""):`<p class="mute">${t("none")}</p>`)+`<div class="note">${t("disc")}</div>`;
$("#ed").onclick=form;
document.querySelectorAll(".card.click").forEach(c=>{const f=()=>detail(res[+c.dataset.i]);c.onclick=f;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}})}
function detail(x){const s=x.s;
$("#app").innerHTML=`<p><button class="btn alt" id="bk">← ${t("back")}</button></p><h2>${s.n[["en","kn","hi"].indexOf(L)]}</h2>
<div class="row"><span class="pill ${x.sc>=70?"g":"y"}">${x.sc}% ${t("match")} · ${lbl(x.sc)}</span></div><div class="bar ${x.sc>=70?"":"y"}"><i style="width:${x.sc}%"></i></div>
<div class="sec"><h3>💰 ${t("ben")}</h3><p>${s.b}</p></div>
<div class="sec"><h3>✅ ${t("why")}</h3><ul class="ok">${x.r.map(([ok,tx])=>`<li class="${ok?"":"no"}">${tx}</li>`).join("")}</ul></div>
<div class="sec"><h3>📋 ${t("docs")}</h3><div class="chips">${s.docs.map(d=>`<span>${d}</span>`).join("")}</div></div>
<div class="sec mute">🏛 ${t("src")}: ${s.src}<br>📅 ${t("ver")}: ${V}</div>
<p><a class="btn" href="${s.u}" target="_blank" rel="noopener noreferrer">${t("apply")} ↗</a></p><div class="note">${t("disc")}</div>`;
$("#bk").onclick=results;window.scrollTo(0,0)}
$("#lang").onchange=e=>{L=e.target.value;document.documentElement.lang=L;home()};
$("#home").onclick=home;
home();
</script>
